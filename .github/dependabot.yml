version: 2
updates:
  # npm: one grouped PR a month instead of one PR per package.
  # Security updates are separate and still open their own PRs as soon as a fix exists.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "automated"
    groups:
      dev-tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # @cloudflare/vitest-pool-workers (up to 0.23) only supports vitest ^4.1, so vitest 5 PRs cannot pass.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions: grouped, monthly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions:
        patterns: ["*"]
